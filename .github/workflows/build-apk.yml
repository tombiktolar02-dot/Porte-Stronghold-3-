# .github/workflows/build-apk.yml — Stronghold 3 Android Wrapper (auto-generated)
# Automatically compiles Stronghold3-Wrapper.apk whenever code is pushed.
# Output: debug-signed APK attached as an artifact, and to the release if a tag is pushed.
name: Build Stronghold 3 APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stronghold3-Wrapper-APK
        path: app/build/outputs/apk/debug/app-debug.apk


