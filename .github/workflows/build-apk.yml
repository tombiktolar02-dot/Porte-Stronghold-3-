name: Build Stronghold 3 Wrapper APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Verify Gradle
        run: gradle --version

      - name: Cache Unicorn x86 (arm64-v8a)
        id: cache-unicorn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/third_party/unicorn
          key: unicorn-2.1.1-x86-arm64-ndk26.1

      - name: Build Unicorn x86 Static Library (arm64-v8a)
        if: steps.cache-unicorn.outputs.cache-hit != 'true'
        run: |
          set -e
          NDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/26.1.10909125"
          git clone --depth 1 --branch 2.1.1 https://github.com/unicorn-engine/unicorn.git /tmp/unicorn-src
          cmake -S /tmp/unicorn-src -B /tmp/unicorn-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DUNICORN_ARCH=x86 \
            -DBUILD_SHARED_LIBS=OFF \
            -DUNICORN_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/unicorn-build --target unicorn -j$(nproc)
          mkdir -p app/src/main/cpp/third_party/unicorn/lib
          mkdir -p app/src/main/cpp/third_party/unicorn/include
          AR="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          {
            echo "CREATE app/src/main/cpp/third_party/unicorn/lib/libunicorn.a"
            for lib in /tmp/unicorn-build/*.a; do
              echo "ADDLIB $lib"
            done
            echo "SAVE"
            echo "END"
          } | "$AR" -M
          cp -r /tmp/unicorn-src/include/unicorn app/src/main/cpp/third_party/unicorn/include/

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Stronghold3-Wrapper.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stronghold3-Wrapper-APK
          path: Stronghold3-Wrapper.apk
